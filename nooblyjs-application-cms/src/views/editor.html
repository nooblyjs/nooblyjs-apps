<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Page · NooblyJS CMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
  <link href="/applications/cms/assets/css/styles.css" rel="stylesheet">
  <link href="/applications/cms/assets/css/cms.css" rel="stylesheet">
</head>
<body>
  <a class="visually-hidden-focusable btn btn-primary position-absolute m-2" href="#cms-main">Skip to content</a>

  <nav class="navbar">
    <div class="container-xl">
      <a class="navbar-brand" href="/applications/cms/"><i class="bi bi-window-stack text-accent me-2"></i>NooblyJS CMS</a>
      <div class="d-flex align-items-center gap-3">
        <span class="cms-user d-none d-sm-inline" id="currentUser"></span>
        <button class="btn btn-sm btn-outline-secondary" id="signOutBtn" type="button"><i class="bi bi-box-arrow-right"></i>Sign out</button>
      </div>
    </div>
  </nav>

  <header class="cms-header">
    <div class="container-xl py-4">
      <a class="editor-back" id="backLink" href="/applications/cms/"><i class="bi bi-arrow-left me-1"></i><span id="backLabel">Back to site</span></a>
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mt-2">
        <div class="d-flex align-items-center gap-3">
          <h1 class="mb-0" id="pageHeading">Loading…</h1>
          <span id="statusBadge"></span>
        </div>
        <div class="d-flex flex-wrap align-items-center gap-2">
          <span class="small text-muted save-state text-end me-1" id="saveState" aria-live="polite"></span>
          <button class="btn btn-link btn-sm me-2" type="button" id="versionsBtn"><i class="bi bi-clock-history"></i>Versions</button>
          <a class="btn btn-link btn-sm me-2" id="previewBtn" target="_blank" rel="noopener"><i class="bi bi-eye"></i>Preview</a>
          <button class="btn btn-secondary btn-sm" type="button" id="saveBtn" title="Ctrl+S / ⌘S">Save</button>
          <div class="btn-group">
            <button class="btn btn-primary btn-sm" type="button" id="publishBtn"><i class="bi bi-send"></i>Publish</button>
            <button class="btn btn-primary btn-sm dropdown-toggle dropdown-toggle-split" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="More publishing options"></button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><button class="dropdown-item" type="button" id="unpublishBtn">Unpublish</button></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="container-xl py-4" id="cms-main" tabindex="-1">
    <div class="row g-4 align-items-start">
      <div class="col-lg-8">
        <div class="editor-shell">
          <div id="toolbar">
            <span class="ql-formats">
              <select class="ql-header" aria-label="Text style">
                <option value="1">Heading 1</option>
                <option value="2">Heading 2</option>
                <option value="3">Heading 3</option>
                <option selected>Normal</option>
              </select>
            </span>
            <span class="ql-formats">
              <button class="ql-bold" aria-label="Bold"></button>
              <button class="ql-italic" aria-label="Italic"></button>
              <button class="ql-underline" aria-label="Underline"></button>
              <button class="ql-strike" aria-label="Strikethrough"></button>
            </span>
            <span class="ql-formats">
              <select class="ql-color" aria-label="Text colour"></select>
              <select class="ql-background" aria-label="Highlight colour"></select>
            </span>
            <span class="ql-formats">
              <button class="ql-list" value="ordered" aria-label="Numbered list"></button>
              <button class="ql-list" value="bullet" aria-label="Bulleted list"></button>
              <select class="ql-align" aria-label="Alignment"></select>
            </span>
            <span class="ql-formats">
              <button class="ql-blockquote" aria-label="Quote"></button>
              <button class="ql-code-block" aria-label="Code block"></button>
            </span>
            <span class="ql-formats">
              <button class="ql-link" aria-label="Link"></button>
              <button class="ql-image" aria-label="Image"></button>
              <button class="ql-video" aria-label="Video"></button>
            </span>
            <span class="ql-formats">
              <button class="ql-clean" aria-label="Clear formatting"></button>
            </span>
          </div>
          <div id="editor"></div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="editor-sidebar d-flex flex-column gap-4">
          <section class="card" aria-labelledby="pageSettingsHeading">
            <h2 class="section-heading mb-3" id="pageSettingsHeading">Page</h2>
            <div class="mb-3">
              <label class="form-label" for="fieldTitle">Title</label>
              <input class="form-control" id="fieldTitle" maxlength="150">
            </div>
            <div class="mb-3">
              <label class="form-label" for="fieldSlug">Address</label>
              <div class="input-group"><span class="input-group-text" id="slugPrefix">/</span><input class="form-control" id="fieldSlug" maxlength="80"></div>
              <div class="form-text d-none" id="homeSlugNote">This is the home page, so visitors see it at the site's root address.</div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="fieldParent">Parent page</label>
              <select class="form-select" id="fieldParent"></select>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="fieldShowInNav">
              <label class="form-check-label" for="fieldShowInNav">Show in navigation</label>
            </div>
          </section>

          <section class="card" aria-labelledby="seoHeading">
            <h2 class="section-heading mb-3" id="seoHeading">Search &amp; sharing</h2>
            <div class="mb-3">
              <label class="form-label d-flex justify-content-between" for="fieldSeoTitle">SEO title <span class="text-muted small" id="seoTitleCount"></span></label>
              <input class="form-control" id="fieldSeoTitle" maxlength="120" placeholder="Defaults to the page title">
            </div>
            <div class="mb-3">
              <label class="form-label d-flex justify-content-between" for="fieldSeoDescription">Description <span class="text-muted small" id="seoDescriptionCount"></span></label>
              <textarea class="form-control" id="fieldSeoDescription" rows="3" maxlength="300" placeholder="Defaults to the site description"></textarea>
            </div>
            <div>
              <label class="form-label">Social image</label>
              <div class="d-flex align-items-center gap-2">
                <img id="ogImagePreview" class="rounded d-none" alt="" style="width: 64px; height: 64px; object-fit: cover;">
                <button class="btn btn-sm btn-outline-secondary" type="button" id="chooseOgImage"><i class="bi bi-image"></i>Choose image</button>
                <button class="btn btn-sm btn-link text-danger d-none" type="button" id="clearOgImage">Remove</button>
              </div>
            </div>
          </section>

          <section class="card" aria-labelledby="scheduleHeading">
            <h2 class="section-heading mb-3" id="scheduleHeading">Schedule</h2>
            <p class="small text-muted mb-2" id="scheduleInfo"></p>
            <label class="form-label visually-hidden" for="fieldSchedule">Publish at</label>
            <input type="datetime-local" class="form-control mb-3" id="fieldSchedule">
            <div class="d-flex align-items-center gap-3">
              <button class="btn btn-sm btn-outline-primary" type="button" id="scheduleBtn"><i class="bi bi-calendar-event"></i>Schedule publish</button>
              <button class="btn btn-sm btn-link text-danger d-none" type="button" id="clearScheduleBtn">Cancel schedule</button>
            </div>
            <p class="small text-muted mt-3 mb-0" id="publishedInfo"></p>
          </section>
        </div>
      </div>
    </div>
  </main>

  <!-- Versions -->
  <div class="modal fade" id="versionsModal" tabindex="-1" aria-labelledby="versionsTitle" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="versionsTitle">Version history</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-4">
              <div class="list-group small rounded-3" id="versionList"></div>
            </div>
            <div class="col-md-8">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="small text-muted" id="versionMeta">Choose a version to preview it.</span>
                <button class="btn btn-sm btn-primary d-none" type="button" id="restoreVersionBtn">Restore this version</button>
              </div>
              <iframe class="version-preview" id="versionPreview" sandbox title="Version preview"></iframe>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Media picker -->
  <div class="modal fade" id="mediaModal" tabindex="-1" aria-labelledby="mediaTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="mediaTitle">Choose an image</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="small text-muted">PNG, JPEG, GIF or WebP, up to 10 MB.</span>
            <label class="btn btn-sm btn-primary mb-0">
              <i class="bi bi-upload"></i><span id="pickerUploadLabel">Upload</span>
              <input type="file" id="pickerUpload" class="d-none" accept="image/png,image/jpeg,image/gif,image/webp">
            </label>
          </div>
          <div class="row g-2" id="pickerGrid"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
  <script type="module" src="/applications/cms/assets/js/editor.js"></script>
</body>
</html>
