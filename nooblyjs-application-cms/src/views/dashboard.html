<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Sites · NooblyJS CMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/applications/cms/assets/css/cms.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar cms-navbar">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="/applications/cms/"><i class="bi bi-window-stack me-2"></i>NooblyJS CMS</a>
      <div class="d-flex align-items-center gap-3">
        <span class="text-muted small" id="currentUser"></span>
        <button class="btn btn-sm btn-outline-secondary" id="signOutBtn" type="button">Sign out</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
      <h1 class="h3 mb-0">Your sites</h1>
      <button class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#newSiteModal">
        <i class="bi bi-plus-lg me-1"></i>New site
      </button>
    </div>
    <div class="row g-3" id="siteGrid">
      <div class="col-12 text-muted">Loading…</div>
    </div>
  </main>

  <div class="modal fade" id="newSiteModal" tabindex="-1" aria-labelledby="newSiteTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="newSiteForm" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="newSiteTitle">New site</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="siteName">Name</label>
            <input class="form-control" id="siteName" maxlength="120" required autocomplete="off">
          </div>
          <div class="mb-3">
            <label class="form-label" for="siteSlug">Address</label>
            <div class="input-group">
              <span class="input-group-text">/sites/</span>
              <input class="form-control" id="siteSlug" maxlength="80" required autocomplete="off">
            </div>
            <div class="form-text">Letters, numbers and hyphens.</div>
          </div>
          <div class="mb-1">
            <label class="form-label" for="siteDescription">Description <span class="text-muted">(optional)</span></label>
            <textarea class="form-control" id="siteDescription" rows="2" maxlength="500"></textarea>
            <div class="form-text">Used for search results when a page has no SEO description.</div>
          </div>
          <div class="alert alert-danger mt-3 mb-0 d-none" id="newSiteError" role="alert"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="createSiteBtn">Create site</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/applications/cms/assets/js/dashboard.js"></script>
</body>
</html>
